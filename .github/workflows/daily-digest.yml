name: Daily Agents Radar

on:
  schedule:
    # Two runs per day (UTC → CST, UTC+8):
    #   23:37 UTC = 07:37 CST (am) — morning edition; opens the day's issues
    #   11:37 UTC = 19:37 CST (pm) — evening update; refreshes the day's files
    #     in place, never opens issues (SKIP_ISSUES=true), and skips the commit
    #     and notifications when nothing substantive changed.
    #
    # The minute is deliberately off the hour. GitHub queues scheduled runs and
    # drops them under load, and the :00 slot is the most contended one. At
    # "0 23 * * *" this workflow degraded badly in August 2026: the 08-26 run
    # was dispatched 5h07m late and the 08-27 run was never created at all.
    - cron: "37 23 * * *"
    - cron: "37 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# A late scheduled run must not overlap a manual catch-up run: both would build
# the same CST day's digest and (in the am slot) open a duplicate set of issues
# (as happened on 2026-08-27, which produced 18 duplicates). Queue rather than
# cancel, so the scheduled run reaches the guard job below only after the manual
# one has committed its digest — and then skips (am) or just refreshes it (pm).
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      slot: ${{ steps.check.outputs.slot }}

    steps:
      - name: Decide slot and whether today's digest already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Slot by CST hour: the two crons land at ~07:37 (am) and ~19:37 (pm).
          HOUR=$(TZ=Asia/Shanghai date +%H)
          if [ "$HOUR" -lt 12 ]; then SLOT=am; else SLOT=pm; fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "CST hour: $HOUR — slot: $SLOT"

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Event is ${{ github.event_name }} — manual runs always proceed."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # CST date, matching the digests/YYYY-MM-DD/ folder produced by toCstDateStr
          DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          if gh api "repos/${{ github.repository }}/contents/digests/$DATE" --silent 2>/dev/null; then
            if [ "$SLOT" = "am" ]; then
              echo "digests/$DATE is already committed — a manual run covered today. Skipping."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            else
              # pm: skip if a pm refresh already landed today (latest commit to
              # today's digests was at/after 12:00 CST). A local cron trigger and
              # this schedule act as mutual backups — this check prevents a
              # double evening run (and double Feishu push) when both fire.
              LAST=$(gh api "repos/${{ github.repository }}/commits?path=digests/$DATE&per_page=1" --jq '.[0].commit.committer.date' 2>/dev/null || true)
              if [ -n "$LAST" ] && [ "$LAST" != "null" ] && [ "$(TZ=Asia/Shanghai date -d "$LAST" +%H)" -ge 12 ]; then
                echo "digests/$DATE was already refreshed after noon CST — pm run done. Skipping."
                echo "should_run=false" >> "$GITHUB_OUTPUT"
              else
                echo "digests/$DATE exists — the pm run refreshes it as an evening update."
                echo "should_run=true" >> "$GITHUB_OUTPUT"
              fi
            fi
          else
            echo "No digests/$DATE yet — proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  digest:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # Web content fetching adds ~60-120 s of HTTP requests on incremental runs.
    # With glm-5.3 (a reasoning model) the LLM phases are slow: ~11 min for
    # per-repo summaries plus translation, with occasional 429 back-off. The
    # first full run once exceeded the old 40-min budget and was cancelled.
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run daily digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Primary: MiniMax-M3 — fastest and no 429s under sustained load in
          # testing; GLM glm-5.3 rate-limits under load, so it serves as the
          # fallback (tried once per call after the primary's retries exhaust).
          # To switch back: set LLM_PROVIDER to glm and drop MINIMAX_API_KEY.
          LLM_PROVIDER: minimax
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          LLM_FALLBACK_PROVIDER: glm
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          # Tiering: deep = GLM glm-5.3 (strong reasoning) for the few
          # high-value analysis calls (3 comparisons + trending + web report);
          # everything else (per-repo summaries, listing reports, translation,
          # highlights) runs on MiniMax-M3. Deep-tier failures fall to MiniMax,
          # then to LLM_FALLBACK_PROVIDER.
          LLM_DEEP_PROVIDER: glm
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          DIGEST_REPO: ${{ github.repository }}
          # The pm run only refreshes the day's markdown — issues are the am
          # run's job, so suppress issue creation entirely in the evening.
          SKIP_ISSUES: ${{ needs.guard.outputs.slot == 'pm' }}
        run: pnpm start

      - name: Commit digest files
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          # Substantive-change detection: every run rewrites the "生成时间 /
          # Generated" timestamp headers and highlights.json (LLM output is
          # reworded every time), so a pm run whose content matches the am run
          # must read as "no changes". Filter those out of the staged diff.
          SUBSTANTIVE=$(git diff --cached -- digests/ ':(exclude)digests/*/highlights.json' \
            | grep -E '^[+-]' \
            | grep -vE '^(\+\+\+|---)' \
            | grep -vE '生成时间|Generated' \
            || true)
          if [ -z "$SUBSTANTIVE" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No substantive digest changes (timestamps/highlights only) — skipping commit."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            # CST date, matching the digests/YYYY-MM-DD/ folder produced by toCstDateStr
            DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
            git commit -m "digest: ${DATE} daily digest"
            git pull --rebase
            git push
          fi

      - name: Update web manifest
        if: steps.commit.outputs.has_changes == 'true'
        env:
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: pnpm manifest

      - name: Commit manifest and feed
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          git add manifest.json feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update manifest.json"
            git pull --rebase
            git push
          fi

      - name: Send Telegram notification
        if: steps.commit.outputs.has_changes == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '@agents_radar' }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: pnpm notify

      - name: Send Feishu notification
        if: steps.commit.outputs.has_changes == 'true'
        env:
          FEISHU_WEBHOOK_URLS: ${{ secrets.FEISHU_WEBHOOK_URLS }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: pnpm notify:feishu

      - name: Close stale issues
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_REPO: ${{ github.repository }}
        run: pnpm close-stale


